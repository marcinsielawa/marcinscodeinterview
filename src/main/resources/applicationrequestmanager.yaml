openapi: 3.0.3
info:
  title: Application request manager
  description: An service for managing the applicaton request workflow
  version: 0.0.1

paths:
  /api/applications:
    post:
      operationId: CreateApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: 'Application created'
          headers:
            Location:
              schema:
                type: string
                format: uri
  /api/applications/{id}:
    get:
      operationId: RetrieveApplication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stored application data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'

components:
  schemas:
    CreateApplicationRequest:
      type: object
      required: 
        - name
        - body
      properties:
        name: 
          type: string
          pattern: '.*\S.*'
        body: 
          type: string
          pattern: '.*\S.*'
    ApplicationState:
      type: string
      enum: [CREATED]
    ApplicationResponse:
      type: object
      required:
        - id
        - state
        - name
        - body
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ApplicationState'
        name:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

